<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共有タイマー</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // フォールバック: メインCDNが失敗した場合の代替CDN
        if (typeof io === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"><\/script>');
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 40px;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            background: white;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 60px;
            text-align: center;
        }
        
        h1 {
            margin: 0 0 50px 0;
            font-size: 3.5em;
            font-weight: normal;
        }
        
        .timer-display {
            font-size: 8em;
            font-family: monospace;
            margin: 50px 0;
            color: #333;
            line-height: 1;
        }
        
        .time-input {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
        }
        
        .time-input input {
            width: 100px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5em;
        }
        
        .time-input label {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 1.4em;
        }
        
        .button {
            background: #007cba;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-size: 1.4em;
            min-width: 120px;
        }
        
        .button:hover:not(:disabled) {
            background: #005a8b;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            margin: 25px 0;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 8px;
        }
        
        .status.running {
            background: #e8f5e8;
            color: #2d5a2d;
        }
        
        .status.paused {
            background: #fff8e1;
            color: #8a6914;
        }
        
        .status.stopped {
            background: #ffeaea;
            color: #8b2635;
        }
        
        .status.finished {
            background: #e3f2fd;
            color: #1565c0;
        }

        .share-area {
            margin: 30px 0 10px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .share-area label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .share-controls {
            display: flex;
            gap: 8px;
        }

        .share-controls input {
            min-width: 0;
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
        }

        .share-controls .button {
            margin: 0;
            padding: 12px 18px;
            min-width: auto;
            font-size: 1em;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 2.5em;
            }

            .timer-display {
                font-size: 4.5em;
            }

            .share-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>タイマー</h1>

        <div class="share-area">
            <label for="shareUrl">このタイマーを共有</label>
            <div class="share-controls">
                <input type="text" id="shareUrl" readonly>
                <button class="button" id="copyBtn" onclick="copyShareUrl()">リンクをコピー</button>
            </div>
        </div>
        
        <div class="timer-display" id="timerDisplay">00:00</div>
        
        <div class="status" id="statusDisplay">停止中</div>
        
        <div class="time-input">
            <label>
                <input type="number" id="minutesInput" min="0" max="1440" value="5">
                分
            </label>
            <label>
                <input type="number" id="secondsInput" min="0" max="59" value="0">
                秒
            </label>
        </div>
        
        <div>
            <button class="button" id="startBtn" onclick="startTimer()">開始</button>
            <button class="button" id="pauseBtn" onclick="pauseTimer()" disabled>一時停止</button>
            <button class="button" id="resumeBtn" onclick="resumeTimer()" disabled>再開</button>
            <button class="button" id="stopBtn" onclick="stopTimer()" disabled>停止</button>
        </div>
    </div>

    <script>
        // Socket.IOの読み込み確認
        if (typeof io === 'undefined') {
            alert('Socket.IOライブラリの読み込みに失敗しました。ページを再読み込みしてください。');
            throw new Error('Socket.IO library failed to load');
        }
        
        const roomId = {{ room_id|tojson }};
        const socket = io({
            query: { room_id: roomId }
        });

        const shareUrl = document.getElementById('shareUrl');
        shareUrl.value = window.location.href;
        
        let timerState = {
            isRunning: false,
            remainingTime: 0
        };
        
        // 接続状態の管理（シンプルなコンソールログのみ）
        socket.on('connect', function() {
            console.log('Connected to server');
        });
        
        socket.on('disconnect', function() {
            console.log('Disconnected from server');
        });
        
        // タイマー更新
        socket.on('timer_update', function(data) {
            timerState.remainingTime = data.remaining_time;
            timerState.isRunning = data.is_running;
            updateDisplay();
            updateButtons();
        });
        
        // タイマー開始
        socket.on('timer_started', function(data) {
            timerState.isRunning = true;
            timerState.remainingTime = data.remaining_time;
            updateDisplay();
            updateButtons();
            updateStatus('実行中', 'running');
        });
        
        // タイマー停止
        socket.on('timer_stopped', function() {
            timerState.isRunning = false;
            timerState.remainingTime = 0;
            updateDisplay();
            updateButtons();
            updateStatus('停止中', 'stopped');
        });
        
        // タイマー一時停止
        socket.on('timer_paused', function(data) {
            timerState.isRunning = false;
            timerState.remainingTime = data.remaining_time;
            updateDisplay();
            updateButtons();
            updateStatus('一時停止中', 'paused');
        });
        
        // タイマー再開
        socket.on('timer_resumed', function(data) {
            timerState.isRunning = true;
            timerState.remainingTime = data.remaining_time;
            updateDisplay();
            updateButtons();
            updateStatus('実行中', 'running');
        });
        
        // タイマー終了
        socket.on('timer_finished', function() {
            timerState.isRunning = false;
            timerState.remainingTime = 0;
            updateDisplay();
            updateButtons();
            updateStatus('🎉 時間です！', 'finished');
            
            // 通知音やアラート（ブラウザの通知機能）
            if (Notification.permission === 'granted') {
                new Notification('タイマー終了！', {
                    body: '設定した時間が経過しました。',
                    icon: '/favicon.ico'
                });
            }
            
            // 簡単なアラート音
            playAlertSound();
        });

        socket.on('timer_error', function(data) {
            alert(data.message || 'タイマーの設定を確認してください。');
        });
        
        function updateDisplay() {
            const minutes = Math.floor(timerState.remainingTime / 60);
            const seconds = Math.floor(timerState.remainingTime % 60);
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;
        }
        
        function updateButtons() {
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resumeBtn = document.getElementById('resumeBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            if (timerState.isRunning) {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                resumeBtn.disabled = true;
                stopBtn.disabled = false;
            } else if (timerState.remainingTime > 0) {
                startBtn.disabled = true;
                pauseBtn.disabled = true;
                resumeBtn.disabled = false;
                stopBtn.disabled = false;
            } else {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resumeBtn.disabled = true;
                stopBtn.disabled = true;
            }
        }
        
        function updateStatus(text, className) {
            const statusDisplay = document.getElementById('statusDisplay');
            statusDisplay.textContent = text;
            statusDisplay.className = `status ${className}`;
        }
        
        function startTimer() {
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            
            if (minutes === 0 && seconds === 0) {
                alert('時間を設定してください');
                return;
            }
            
            socket.emit('start_timer', {
                minutes: minutes,
                seconds: seconds
            });
        }
        
        function pauseTimer() {
            socket.emit('pause_timer');
        }
        
        function resumeTimer() {
            socket.emit('resume_timer');
        }
        
        function stopTimer() {
            socket.emit('stop_timer');
        }

        async function copyShareUrl() {
            const copyBtn = document.getElementById('copyBtn');
            try {
                await navigator.clipboard.writeText(shareUrl.value);
                copyBtn.textContent = 'コピーしました';
                setTimeout(() => copyBtn.textContent = 'リンクをコピー', 1500);
            } catch (error) {
                shareUrl.select();
                document.execCommand('copy');
                copyBtn.textContent = 'コピーしました';
                setTimeout(() => copyBtn.textContent = 'リンクをコピー', 1500);
            }
        }
        
        function playAlertSound() {
            // Web APIを使用してビープ音を生成
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1);
        }
        
        // 通知の許可を求める
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        
        // 初期状態の更新
        updateDisplay();
        updateButtons();
    </script>
</body>
</html>
