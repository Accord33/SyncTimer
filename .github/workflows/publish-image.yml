name: Test and Push SyncTimer Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HARBOR_HOST: harbor.accordlab
  HARBOR_IMAGE: harbor.accordlab/synctimer/synctimer

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  publish:
    name: Build and Push via Tailscale
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Add Harbor to /etc/hosts
        run: |
          echo "${{ secrets.HARBOR_IP }} harbor.accordlab" | sudo tee -a /etc/hosts

      - name: Configure Docker for insecure registry
        run: |
          echo '{"insecure-registries": ["harbor.accordlab"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | \
            docker login harbor.accordlab \
              -u "$HARBOR_USERNAME" \
              --password-stdin

      - name: Build and push immutable image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "${HARBOR_IMAGE}:${IMAGE_TAG}" \
            .
          docker push "${HARBOR_IMAGE}:${IMAGE_TAG}"
          echo "Published image: ${HARBOR_IMAGE}:${IMAGE_TAG}"
